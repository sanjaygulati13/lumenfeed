name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t lumenfeed .

      - name: Smoke test
        run: |
          docker run -d --name lf -p 5024:5024 -e LUMEN_REFRESH=86400 lumenfeed
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:5024/ | grep -q "<title>Lumenfeed" && exit 0
            sleep 2
          done
          docker logs lf
          exit 1
