[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenfeed"
dynamic = ["version"]
description = "Turn infinite scroll into knowledge — a self-hosted, personalized feed of curated tech/AI writing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sanjay Gulati", email = "sanjaygulati13@gmail.com"}
]
keywords = ["news", "rss", "feed", "ai", "tech", "personalization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/sanjaygulati13/lumenfeed"
Repository = "https://github.com/sanjaygulati13/lumenfeed"
Issues = "https://github.com/sanjaygulati13/lumenfeed/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
lumenfeed = "lumenfeed.__main__:main"

[tool.setuptools]
packages = ["lumenfeed"]

[tool.setuptools.dynamic]
version = {attr = "lumenfeed.__version__"}

[tool.setuptools.package-data]
lumenfeed = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Tests use long single-line SQL literals; don't enforce the line length there.
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
