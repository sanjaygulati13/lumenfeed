<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff3d77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Curated tech/AI news feed with personalization">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<title>Lumenfeed</title>
<style>
:root {
  --bg:#f6f7f9; --card-bg:#ffffff; --card-border:#e7e9ee;
  --text:#16181d; --text-dim:#6b7280;
  --accent:#c13584; --accent-dim:rgba(193,53,132,0.10);
  --grad:linear-gradient(45deg,#8a3ffc 0%,#ff3d77 52%,#ff8a3d 100%);
  --header-bg:#ffffffdd;
  --shadow:0 1px 3px rgba(16,18,29,0.06);
  --shadow-hover:0 10px 26px rgba(193,53,132,0.16);
  --shadow-pop:0 18px 50px rgba(16,18,29,0.30);
  --read-opacity:0.5; --radius:18px; --tabbar-h:60px;
  --transition:0.22s cubic-bezier(.2,.8,.25,1);
}
[data-theme="dark"] {
  --bg:#0b0d12; --card-bg:#151922; --card-border:#232936;
  --text:#eef1f6; --text-dim:#98a1b3;
  --accent:#f472b6; --accent-dim:rgba(244,114,182,0.16);
  --grad:linear-gradient(45deg,#a06bff 0%,#ff5c93 52%,#ffa14d 100%);
  --header-bg:#12151ddd;
  --shadow:0 1px 3px rgba(0,0,0,0.4);
  --shadow-hover:0 10px 26px rgba(244,114,182,0.20);
  --shadow-pop:0 18px 50px rgba(0,0,0,0.60);
  --read-opacity:0.45;
}
* { margin:0; padding:0; box-sizing:border-box; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; padding-bottom:calc(var(--tabbar-h) + 18px); }
button { font-family:inherit; }
a { color:inherit; text-decoration:none; }

#progress-bar { position:fixed; top:0; left:0; height:3px; width:0; z-index:100; opacity:0; transition:width .1s,opacity .2s; background:var(--grad); }
#progress-bar.visible { opacity:1; }
#pull-indicator { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:120; pointer-events:none; opacity:0; transition:opacity .2s; }
#pull-indicator.show { opacity:1; }
.pull-spinner { width:22px; height:22px; border-radius:50%; border:3px solid var(--card-border); border-top-color:var(--accent); animation:spin .7s linear infinite; }

header { position:sticky; top:0; z-index:50; background:var(--header-bg); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4); border-bottom:1px solid var(--card-border); }
.header-inner { max-width:640px; margin:0 auto; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
.logo { font-size:1.32rem; font-weight:800; letter-spacing:-.03em; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.header-actions { display:flex; gap:6px; }
.icon-btn { width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:var(--text); font-size:1.1rem; cursor:pointer; display:grid; place-items:center; transition:background var(--transition), transform var(--transition); }
.icon-btn:hover { background:var(--accent-dim); }
.icon-btn:active { transform:scale(.9); }
.icon-btn.spinning { animation:spin .8s linear; }

.subhead { position:sticky; top:56px; z-index:40; background:var(--header-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--card-border); transition:opacity .2s; }
.subhead-inner { max-width:640px; margin:0 auto; padding:10px 16px 12px; }
.section-label { font-size:.74rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }
.story-rings { display:flex; gap:14px; overflow-x:auto; padding:2px; scrollbar-width:none; }
.story-rings::-webkit-scrollbar { display:none; }
.story-ring { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px; width:62px; background:none; border:none; cursor:pointer; padding:0; }
.story-ring .ring { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; padding:3px; background:conic-gradient(var(--accent),#ff8a3d,#8a3ffc,var(--accent)); transition:transform .2s; }
.story-ring .ring-inner { width:100%; height:100%; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-size:1.45rem; box-shadow:inset 0 0 0 2px var(--card-bg); }
.story-ring.active .ring { transform:scale(1.06); }
.story-ring.active .ring-inner { box-shadow:inset 0 0 0 2px var(--bg),0 0 0 2px var(--accent); }
.story-ring.focus .ring { box-shadow:0 0 0 2px var(--bg),0 0 10px rgba(255,138,61,.7); }
.story-ring .ring-label { font-size:.68rem; color:var(--text-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60px; }
.story-ring.active .ring-label { color:var(--text); font-weight:700; }

main.container { max-width:640px; margin:0 auto; padding:16px 16px 8px; }
.feed { display:flex; flex-direction:column; gap:18px; }
.sentinel { height:10px; }

/* --- Card (A1 post-style + A3 cover) --- */
.card { position:relative; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; cursor:pointer; animation:cardIn .5s cubic-bezier(.22,1,.36,1) both; transition:box-shadow .25s, transform .25s, opacity .25s; }
.card:hover { box-shadow:var(--shadow-hover); transform:translateY(-2px); }
.card.is-read { opacity:var(--read-opacity); }
.card.is-read .read-check { display:flex; }
.read-check { position:absolute; top:10px; right:12px; display:none; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.35); color:#fff; align-items:center; justify-content:center; font-size:.8rem; backdrop-filter:blur(4px); z-index:3; }
.cover { position:relative; height:52px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cover-emoji { font-size:1.85rem; filter:drop-shadow(0 2px 5px rgba(0,0,0,.18)); transition:transform .3s; }
.card:hover .cover-emoji { transform:scale(1.12); }
.card-head { display:flex; align-items:center; gap:10px; padding:12px 14px 0; }
.avatar { width:36px; height:36px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; font-weight:800; font-size:.95rem; }
.cover-id { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.src { font-size:.85rem; font-weight:700; display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.verified { color:var(--accent); font-size:.8rem; }
.time { font-size:.74rem; color:var(--text-dim); margin-top:1px; }
.save-btn { border:none; background:transparent; color:var(--text-dim); width:38px; height:38px; border-radius:50%; display:grid; place-items:center; cursor:pointer; transition:color .2s, background .2s, transform .15s; }
.save-btn:hover { background:var(--accent-dim); }
.save-btn:active { transform:scale(1.2); }
.save-btn.active { color:var(--accent); }
.save-btn.active svg { fill:var(--accent); }
.card-title { padding:11px 14px 0; font-size:1.06rem; font-weight:700; line-height:1.32; letter-spacing:-.01em; }
.card-summary { padding:8px 14px 4px; font-size:.88rem; line-height:1.55; color:var(--text-dim); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card-summary--loading { min-height:2.6em; background:linear-gradient(90deg,transparent,rgba(148,163,184,.14),transparent); background-size:200% 100%; animation:shimmer 1.3s infinite; }
.card-foot { display:flex; align-items:center; gap:8px; padding:11px 14px 13px; }
.badge-why { font-size:.72rem; font-weight:700; color:var(--accent); background:var(--accent-dim); border:none; border-radius:999px; padding:5px 11px; cursor:pointer; transition:transform .15s, background .2s; }
.badge-why:hover { transform:translateY(-1px); filter:brightness(1.05); }
.readtime { font-size:.74rem; color:var(--text-dim); }
.spacer { flex:1; }
.share-btn { border:none; background:transparent; color:var(--text-dim); width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer; transition:color .2s, background .2s; }
.share-btn:hover { color:var(--accent); background:var(--accent-dim); }

/* --- Digest card (D3) --- */
.digest { background:var(--card-bg); border:1px solid var(--card-border); border-left:4px solid; border-image:var(--grad) 1; border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; animation:cardIn .5s cubic-bezier(.22,1,.36,1) both; }
.digest-head { display:flex; align-items:baseline; justify-content:space-between; }
.digest-kicker { font-size:.72rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.digest-sub { font-size:.74rem; color:var(--text-dim); }
.digest-cats { display:flex; flex-wrap:wrap; gap:7px; margin:11px 0 10px; }
.digest-chip { font-size:.74rem; font-weight:600; background:var(--accent-dim); color:var(--text); border-radius:999px; padding:4px 11px; }
.digest-chip b { color:var(--accent); }
.digest-highs { display:flex; flex-direction:column; gap:7px; }
.digest-highs a { font-size:.85rem; font-weight:600; line-height:1.4; display:flex; gap:7px; align-items:baseline; cursor:pointer; }
.digest-highs a::before { content:"→"; color:var(--accent); font-weight:800; }
.digest-highs a:hover { color:var(--accent); }

/* --- Bottom tab bar (B1) --- */
.tabbar { position:fixed; bottom:0; left:0; right:0; z-index:60; background:var(--header-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--card-border); height:var(--tabbar-h); display:flex; justify-content:space-around; padding-bottom:env(safe-area-inset-bottom); }
.tab { flex:1; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:none; background:none; color:var(--text-dim); font-size:1.25rem; cursor:pointer; transition:color .2s, transform .12s; }
.tab span { font-size:.64rem; font-weight:700; }
.tab:active { transform:scale(.9); }
.tab.active { color:var(--accent); }
.tab.active::after { content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:34px; height:3px; border-radius:0 0 4px 4px; background:var(--grad); }
.tab-count { position:absolute; top:8px; right:calc(50% - 20px); min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--grad); color:#fff; font-size:.64rem; font-weight:800; display:grid; place-items:center; line-height:1; }

/* --- Reader overlay (C1) --- */
.reader { position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; animation:slideUp .28s cubic-bezier(.22,1,.36,1); }
.reader-bar { height:3px; background:var(--card-border); }
.reader-progress { height:100%; width:0; background:var(--grad); transition:width .1s linear; }
.reader-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.reader-top { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--header-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--card-border); }
.reader-close { width:36px; height:36px; border-radius:50%; border:none; background:var(--accent-dim); color:var(--text); font-size:1rem; cursor:pointer; display:grid; place-items:center; }
.reader-src { font-size:.82rem; font-weight:700; color:var(--text-dim); }
.reader-content { max-width:680px; margin:0 auto; padding:22px 20px 40px; }
.reader-title { font-size:1.55rem; font-weight:800; line-height:1.28; letter-spacing:-.02em; margin-bottom:10px; }
.reader-meta { font-size:.8rem; color:var(--text-dim); margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--card-border); }
.reader-body { display:flex; flex-direction:column; gap:16px; }
.reader-para { font-size:1.02rem; line-height:1.72; color:var(--text); }
.reader-para.dim { color:var(--text-dim); font-style:italic; }
.reader-loading { display:flex; flex-direction:column; align-items:center; gap:12px; color:var(--text-dim); padding:40px 0; font-size:.9rem; }
.spinner { width:26px; height:26px; border-radius:50%; border:3px solid var(--card-border); border-top-color:var(--accent); animation:spin .7s linear infinite; }
.reader-actions { display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; }
.rbtn { flex:1 1 auto; min-width:120px; padding:12px 16px; border-radius:12px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--text); font-size:.9rem; font-weight:700; cursor:pointer; text-align:center; transition:background .2s, border-color .2s, color .2s; }
.rbtn:hover { border-color:var(--accent); color:var(--accent); }
.rbtn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
.rbtn-primary { background:var(--grad); color:#fff; border:none; }
.rbtn-primary:hover { filter:brightness(1.06); color:#fff; }

/* --- Bottom action sheet (C2 long-press) --- */
.sheet-backdrop { position:fixed; inset:0; z-index:210; background:rgba(8,10,16,.5); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s; }
.actionsheet { width:100%; max-width:560px; background:var(--card-bg); border-radius:20px 20px 0 0; padding:8px 14px calc(16px + env(safe-area-inset-bottom)); box-shadow:var(--shadow-pop); animation:sheetUp .28s cubic-bezier(.22,1,.36,1); }
.sheet-handle { width:40px; height:4px; border-radius:2px; background:var(--card-border); margin:6px auto 10px; }
.actionsheet-item { display:flex; align-items:center; gap:12px; width:100%; border:none; background:none; color:var(--text); font-size:1rem; font-weight:600; padding:14px 10px; border-radius:12px; cursor:pointer; text-align:left; transition:background .15s; }
.actionsheet-item:hover { background:var(--accent-dim); }
.actionsheet-item .ai-ic { width:30px; height:30px; border-radius:9px; background:var(--accent-dim); display:grid; place-items:center; font-size:1rem; }

/* --- Why popover (D1) --- */
#why-backdrop { align-items:center; padding:20px; }
.why-pop { width:100%; max-width:400px; background:var(--card-bg); border-radius:20px; padding:20px; box-shadow:var(--shadow-pop); animation:popIn .24s cubic-bezier(.22,1,.36,1); }
.why-pop h3 { font-size:1.05rem; margin-bottom:12px; }
.why-row { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--card-border); font-size:.92rem; }
.why-row b { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-size:1.05rem; }
.why-pop .dim { color:var(--text-dim); font-size:.82rem; line-height:1.5; margin:12px 0; }
.why-close { width:100%; margin-top:8px; }

/* --- Toast, skeleton, empty --- */
.toast { position:fixed; bottom:calc(var(--tabbar-h) + 20px); left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:10px 20px; border-radius:999px; font-size:.85rem; font-weight:600; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:300; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.skeleton { pointer-events:none; }
.sk-line { height:14px; border-radius:7px; margin-bottom:10px; background:linear-gradient(90deg,rgba(148,163,184,.12) 25%,rgba(148,163,184,.26) 37%,rgba(148,163,184,.12) 63%); background-size:400% 100%; animation:shimmer 1.3s infinite; }
.sk-line.w60 { width:60%; } .sk-line.w80 { width:80%; }
.empty-state { display:flex; flex-direction:column; align-items:center; gap:12px; padding:70px 20px; color:var(--text-dim); text-align:center; }
.empty-state .empty-icon { font-size:3rem; }
.empty-state p { font-size:.95rem; }

#back-top { position:fixed; bottom:calc(var(--tabbar-h) + 18px); right:18px; width:44px; height:44px; border-radius:50%; border:none; background:var(--grad); color:#fff; font-size:1.2rem; cursor:pointer; box-shadow:var(--shadow-hover); opacity:0; transform:translateY(14px); pointer-events:none; transition:opacity .25s, transform .25s; z-index:55; }
#back-top.visible { opacity:1; transform:translateY(0); pointer-events:auto; }

@keyframes spin { to { transform:rotate(360deg); } }
@keyframes shimmer { 0% { background-position:100% 0; } 100% { background-position:-100% 0; } }
@keyframes cardIn { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
@keyframes slideUp { from { transform:translateY(24px); opacity:.4; } to { transform:none; opacity:1; } }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:none; } }
@keyframes popIn { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:none; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes heartPop { 0% { opacity:0; transform:scale(.3); } 25% { opacity:1; transform:scale(1.25); } 70% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.4) translateY(-24px); } }
.like-burst { position:absolute; top:42%; left:50%; font-size:3.4rem; pointer-events:none; z-index:20; transform:translate(-50%,-50%); animation:heartPop .7s ease-out forwards; }
.swipe-tag { position:absolute; left:14px; top:50%; transform:translateY(-50%); background:linear-gradient(135deg,#e11d48,#f43f5e); color:#fff; font-size:.76rem; font-weight:800; padding:7px 13px; border-radius:999px; opacity:0; pointer-events:none; z-index:6; box-shadow:0 4px 14px rgba(225,29,72,.4); }
.card--dismissed { transform:translateX(-140%) !important; opacity:0 !important; }
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="pull-indicator"><div class="pull-spinner"></div></div>

<header>
  <div class="header-inner">
    <div class="logo">Lumenfeed</div>
    <div class="header-actions">
      <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">&#10227;</button>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">&#127769;</button>
    </div>
  </div>
</header>

<div class="subhead">
  <div class="subhead-inner">
    <div class="section-label" id="section-label">For You</div>
    <div class="story-rings" id="story-rings"></div>
  </div>
</div>

<main class="container">
  <div class="feed" id="feed"></div>
  <div class="sentinel" id="sentinel"></div>
</main>

<nav class="tabbar">
  <button class="tab active" data-tab="for" aria-label="For You">&#10024;<span>For You</span></button>
  <button class="tab" data-tab="all" aria-label="All">&#128240;<span>All</span></button>
  <button class="tab" data-tab="saved" aria-label="Saved">&#128278;<span>Saved</span><b class="tab-count" id="saved-count" hidden>0</b></button>
</nav>

<button id="back-top" aria-label="Back to top">&#8593;</button>
<div class="toast" id="toast"></div>

<!-- In-app reader (C1) -->
<div class="reader" id="reader" hidden>
  <div class="reader-bar"><div class="reader-progress" id="reader-progress"></div></div>
  <div class="reader-scroll" id="reader-scroll">
    <div class="reader-top">
      <button class="reader-close" id="reader-close" aria-label="Close">&#10005;</button>
      <span class="reader-src" id="reader-src"></span>
    </div>
    <div class="reader-content">
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-meta" id="reader-meta"></div>
      <div class="reader-body" id="reader-body"></div>
      <div class="reader-actions">
        <a class="rbtn rbtn-primary" id="reader-open" target="_blank" rel="noopener">Open original &#8599;</a>
        <button class="rbtn" id="reader-share">Share</button>
        <button class="rbtn" id="reader-save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Long-press action sheet (C2) -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="actionsheet" id="actionsheet"><div class="sheet-handle"></div></div>
</div>

<!-- Why popover (D1) -->
<div class="sheet-backdrop" id="why-backdrop" hidden>
  <div class="why-pop" id="why-pop"></div>
</div>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const feed = $("#feed"), sentinel = $("#sentinel");
const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? u : "#");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATEGORIES = ["AI/ML","AI Labs","Languages","Tech News","Research","Physical AI"];
const CAT_META = {
  "AI/ML":       { icon:"\u{1F916}", hue:"#7c3aed" },
  "AI Labs":     { icon:"\u{1F9E0}", hue:"#e0447f" },
  "Languages":   { icon:"\u{2328}\uFE0F", hue:"#0d9488" },
  "Tech News":   { icon:"\u{1F4F0}", hue:"#4f74d6" },
  "Research":    { icon:"\u{1F52C}", hue:"#e05577" },
  "Physical AI": { icon:"\u{1F9BE}", hue:"#e5762e" },
};
const HUE_DEFAULT = "#64748b";
const VERIFIED = new Set(["OpenAI","Anthropic","DeepMind","Google AI","Microsoft Research","Hugging Face","Simon Willison","Rust Blog","Go Blog","Python Blog","arXiv cs.LG"]);
const SVG_BOOKMARK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const SVG_SHARE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>';
const TABS = { for:"For You", all:"All", saved:"Saved" };

const state = {
  tab: localStorage.getItem("lumenfeed-tab") || "for",
  category: "all",
  lastId: null, lastTs: null, loading: false, done: false,
  pageSize: 12,
  prefs: null,
  saved: new Set(),
  shownForYou: new Set(),   // ids already rendered in the personalized feed (dedup)
};
let currentReaderArt = null, digestHighlights = [];

function timeAgo(v) {
  if (v === null || v === undefined || v === "") return "";
  let t;
  if (typeof v === "number") t = v * 1000;
  else if (/^\d+(\.\d+)?$/.test(String(v))) t = parseFloat(v) * 1000;
  else t = Date.parse(String(v).replace(" ","T") + (String(v).includes("T") ? "" : "Z"));
  if (isNaN(t)) return "";
  let s = (Date.now() - t) / 1000;
  if (s < 0) s = 0;
  if (s < 3600) return Math.max(1,Math.floor(s/60)) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  if (s < 604800) return Math.floor(s/86400) + "d";
  return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function readTime(art) {
  const words = ((art.summary||"") + " " + (art.title||"")).split(/\s+/).length;
  return Math.max(2, Math.min(6, 2 + Math.floor(words/120)));
}
function hueFor(cat) { return (CAT_META[cat] || {}).hue || HUE_DEFAULT; }
function coverBg(hue) { return `linear-gradient(180deg, ${hue}2b, ${hue}00)`; }
function avatarBg(hue) { return `${hue}22`; }
function iconFor(cat) { return (CAT_META[cat] || { icon:"\u2022" }).icon; }
function showToast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
/* --- Story rings (A2 + D2 focus) --- */
function buildStoryRings() {
  const wrap = $("#story-rings");
  const items = [{ name:"all", label:"All", icon:"\u{1F31F}" }]
    .concat(CATEGORIES.map(c => ({ name:c, label:c, icon: iconFor(c) })));
  wrap.innerHTML = items.map(it =>
    `<button class="story-ring" data-cat="${esc(it.name)}">
       <span class="ring"><span class="ring-inner">${it.icon}</span></span>
       <span class="ring-label">${esc(it.label)}</span>
     </button>`).join("");
  $$(".story-ring", wrap).forEach(r => r.addEventListener("click", () => setCategory(r.dataset.cat)));
  updateRings();
}
function updateRings() {
  $$(".story-ring").forEach(r => {
    const on = r.dataset.cat === state.category;
    r.classList.toggle("active", on);
    let focus = false;
    if (state.prefs && r.dataset.cat !== "all") focus = (state.prefs.categories[r.dataset.cat] ?? 0) > 0.5;
    r.classList.toggle("focus", focus && !on);
  });
}
function setCategory(cat) {
  state.category = cat;
  updateRings();
  resetFeed();
}
function setTab(tab) {
  state.tab = tab;
  localStorage.setItem("lumenfeed-tab", tab);
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  $("#section-label").textContent = TABS[tab];
  $(".subhead").style.opacity = tab === "saved" ? "0.55" : "1";
  resetFeed();
}

/* --- Feed --- */
function resetFeed() {
  state.lastId = null; state.lastTs = null; state.done = false;
  state.shownForYou = new Set();
  feed.innerHTML = "";
  if (state.tab === "for") mountDigest();
  fetchFeed();
}
async function fetchFeed() {
  if (state.loading || state.done) return;
  state.loading = true; showSkeleton(true);
  let url;
  try {
    if (state.tab === "saved") {
      url = `/api/saved?limit=${state.pageSize}`;
      if (state.lastId !== null) url += `&after=${state.lastId}`;
    } else {
      const mode = state.tab === "for" ? "personalized" : "all";
      url = `/api/articles?limit=${state.pageSize}&mode=${mode}`;
      if (state.category !== "all") url += `&category=${encodeURIComponent(state.category)}`;
      if (mode === "personalized") {
        // Re-ranked feed: a chronological cursor would drop rows, so instead hide
        // everything already shown and let the server return the next best unseen.
        if (state.shownForYou.size) url += `&exclude=${[...state.shownForYou].join(",")}`;
      } else if (state.lastTs !== null && state.lastId !== null) {
        url += `&after_ts=${state.lastTs}&after_id=${state.lastId}`;
      }
    }
    const res = await fetch(url); if (!res.ok) throw 0;
    let articles = await res.json();
    if (state.tab === "saved" && state.category !== "all") articles = articles.filter(a => a.category === state.category);
    if (!articles.length) { state.done = true; if (!feed.querySelector(".card,.digest")) showEmpty(); return; }
    if (articles.length < state.pageSize) state.done = true;
    const _last = articles[articles.length-1]; state.lastId = _last.id; state.lastTs = _last.published_ts ?? null;
    const es = feed.querySelector(".empty-state"); if (es) es.remove();
    const start = feed.querySelectorAll(".card").length;
    const frag = document.createDocumentFragment();
    articles.forEach((a,i) => {
      if (state.tab === "for") state.shownForYou.add(a.id);
      frag.appendChild(createCard(a, start+i));
    });
    feed.appendChild(frag);
  } catch(e) {
    if (!state.done && !feed.querySelector(".card")) showEmpty();
  } finally { state.loading = false; showSkeleton(false); }
}
function showSkeleton(show) {
  sentinel.innerHTML = "";
  if (show) {
    const s = document.createElement("div");
    s.className = "card skeleton";
    s.innerHTML = '<div style="height:70px"></div><div class="sk-line w60" style="margin-top:12px"></div><div class="sk-line w80"></div><div class="sk-line"></div>';
    sentinel.appendChild(s);
  }
}
function showEmpty() {
  if (feed.querySelector(".card,.digest")) return;
  const msg = state.tab === "saved" ? ["\u{1F4D1}","No saved stories yet","Tap the bookmark on any story to keep it here."]
    : ["\u{1F4F0}","Nothing here yet","Pull down or refresh to load the latest."];
  feed.innerHTML = `<div class="empty-state"><div class="empty-icon">${msg[0]}</div><h3>${msg[1]}</h3><p>${msg[2]}</p></div>`;
}

/* --- Card (A1 + A3 + C3 + D1) --- */
function createCard(art, index) {
  if (art.is_saved) state.saved.add(art.id);
  const card = document.createElement("div");
  card.className = "card" + (art.is_read ? " is-read" : "");
  card.dataset.id = art.id;
  card.style.animationDelay = `${Math.min(index*40, 400)}ms`;
  const hue = hueFor(art.category), icon = iconFor(art.category);
  const verified = VERIFIED.has(art.source) ? '<span class="verified" title="Trusted source">\u2713</span>' : "";
  const time = timeAgo(art.published_ts ?? art.published);
  const initials = esc((art.source||"?").trim().charAt(0).toUpperCase());
  const hasSummary = Boolean(art.summary);
  card.innerHTML = `
    <div class="cover" style="background:${coverBg(hue)}"><span class="cover-emoji">${icon}</span></div>
    ${art.is_read ? '<span class="read-check">\u2713</span>' : ""}
    <span class="swipe-tag">\u{1F4C9} Less like this</span>
    <div class="card-head">
      <div class="avatar" style="background:${avatarBg(hue)};color:${hue};border:1px solid ${hue}33">${initials}</div>
      <div class="cover-id">
        <div class="src">${esc(art.source)} ${verified}</div>
        ${time ? `<div class="time">${time}</div>` : ""}
      </div>
      <button class="save-btn ${state.saved.has(art.id)?"active":""}" data-act="save" title="Save" aria-label="Save">${SVG_BOOKMARK}</button>
    </div>
    <div class="card-title">${esc(art.title)}</div>
    ${hasSummary ? `<div class="card-summary">${esc(art.summary)}</div>` : '<div class="card-summary card-summary--loading">&hellip;</div>'}
    <div class="card-foot">
      <button class="badge-why" data-act="why">${esc(art.category)} \u00b7 why</button>
      <span class="readtime">~${readTime(art)} min</span>
      <span class="spacer"></span>
      <button class="share-btn" data-act="share" title="Share" aria-label="Share">${SVG_SHARE}</button>
    </div>`;
  card.querySelector('[data-act=save]').addEventListener("click", e => { e.stopPropagation(); toggleSave(art); });
  card.querySelector('[data-act=share]').addEventListener("click", e => { e.stopPropagation(); shareArt(art); });
  card.querySelector('[data-act=why]').addEventListener("click", e => { e.stopPropagation(); openWhy(art); });
  bindCardGestures(card, art);
  if (!hasSummary) enrichSummary(art.id, card);
  return card;
}
function bindCardGestures(card, art) {
  let tapTimer = null, lastTap = 0, longTimer = null, suppress = false;
  let sx = 0, sy = 0, moved = false, dxNow = 0, swiping = false;
  card.addEventListener("click", (e) => {
    if (suppress) { suppress = false; return; }
    if (e.target.closest("button, a")) return;
    e.preventDefault();
    const now = Date.now();
    if (now - lastTap < 280) { clearTimeout(tapTimer); lastTap = 0; doubleTapSave(art); return; }
    lastTap = now;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => openReader(art), 280);
  });
  card.addEventListener("touchstart", (e) => {
    if (e.target.closest("button, a")) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; moved = false; dxNow = 0; swiping = false;
    longTimer = setTimeout(() => { if (!moved) { longTimer = null; suppress = true; openActions(art); } }, 500);
  }, { passive:true });
  card.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > 10 || ay > 10) { if (longTimer) { clearTimeout(longTimer); longTimer = null; } moved = true; }
    if (ax > ay * 1.2 && dx < 0) {
      swiping = true;
      dxNow = Math.max(dx, -175);
      card.style.transition = "none";
      card.style.transform = `translateX(${dxNow * 0.7}px)`;
      card.style.opacity = String(Math.max(0, 1 + dxNow / 260));
      const tag = card.querySelector(".swipe-tag");
      if (tag) tag.style.opacity = String(Math.min(1, -dxNow / 80));
    }
  }, { passive:true });
  const endTouch = () => {
    if (longTimer) { clearTimeout(longTimer); longTimer = null; }
    if (swiping && dxNow < -90) { suppress = true; dismissCard(art); return; }
    card.style.transition = ""; card.style.transform = ""; card.style.opacity = "";
    const tag = card.querySelector(".swipe-tag"); if (tag) tag.style.opacity = "0";
    dxNow = 0; swiping = false;
  };
  card.addEventListener("touchend", endTouch, { passive:true });
  card.addEventListener("touchcancel", endTouch, { passive:true });
}
function dismissCard(art) {
  const card = feed.querySelector(`.card[data-id="${art.id}"]`);
  if (card) { card.style.transition = "transform .35s ease, opacity .35s ease"; card.classList.add("card--dismissed"); }
  setTimeout(() => {
    if (card) card.remove();
    fetch(`/api/articles/${art.id}/dismiss?kind=source`, { method:"POST" }).then(r => r.json()).then(d => {
      showToast(d && d.source ? `You'll see less from ${d.source}` : "Hidden");
    }).catch(() => {});
    if (!feed.querySelector(".card")) showEmpty();
  }, 340);
}
function saveBurst(art) {
  const card = feed.querySelector(`.card[data-id="${art.id}"]`);
  if (!card) return;
  const b = document.createElement("div"); b.className = "like-burst"; b.textContent = "\u2764\uFE0F";
  card.appendChild(b); setTimeout(() => b.remove(), 720);
}
function updateSavedCount() {
  // Authoritative count from the server (accurate on load, not just from
  // whatever cards happen to be rendered).
  fetch("/api/saved/count").then(r => (r.ok ? r.json() : null)).then(d => {
    const n = d ? d.count : 0, el = $("#saved-count");
    el.hidden = n === 0; el.textContent = n;
  }).catch(() => {});
}
function updateSaveButtons(id, isSaved) {
  $$(`.card[data-id="${id}"] .save-btn`).forEach(b => b.classList.toggle("active", isSaved));
  if (currentReaderArt && currentReaderArt.id === id) {
    const b = $("#reader-save");
    b.textContent = isSaved ? "Saved \u2713" : "Save";
    b.classList.toggle("active", isSaved);
  }
}
function toggleSave(art) {
  const id = art.id;
  if (state.saved.has(id)) {
    fetch(`/api/articles/${id}/save`, { method:"DELETE" }).then(() => { state.saved.delete(id); updateSaveButtons(id,false); updateSavedCount(); });
  } else {
    fetch(`/api/articles/${id}/save`, { method:"POST" }).then(() => { state.saved.add(id); updateSaveButtons(id,true); updateSavedCount(); showToast("Saved"); });
  }
}
function doubleTapSave(art) {
  saveBurst(art);
  if (!state.saved.has(art.id)) {
    fetch(`/api/articles/${art.id}/save`, { method:"POST" }).then(() => { state.saved.add(art.id); updateSaveButtons(art.id,true); updateSavedCount(); });
  }
}
function trackRead(id) {
  fetch(`/api/articles/${id}/read`, { method:"POST" }).then(r => {
    if (r.ok) $$(`.card[data-id="${id}"]`).forEach(c => c.classList.add("is-read"));
  }).catch(() => {});
}
function enrichSummary(id, card) {
  fetch(`/api/articles/${id}/summary`).then(r => (r.ok ? r.json() : null)).then(d => {
    const el = card.querySelector(".card-summary");
    if (!el) return;
    if (d && d.summary) { el.textContent = d.summary; el.classList.remove("card-summary--loading"); }
    else el.remove();
  }).catch(() => { const el = card.querySelector(".card-summary--loading"); if (el) el.remove(); });
}
function mountDigest() {
  const d = document.createElement("div"); d.className = "digest";
  d.innerHTML = '<div class="digest-kicker">This week</div><div class="sk-line w80" style="margin-top:10px"></div><div class="sk-line w60"></div>';
  feed.appendChild(d);
  fetch("/api/digest").then(r => r.json()).then(data => {
    if (!data || !data.total) { d.remove(); return; }
    digestHighlights = data.highlights || [];
    d.innerHTML = `
      <div class="digest-head"><div class="digest-kicker">This week</div>
        <div class="digest-sub">${data.total} stories \u00b7 ${data.categories.length} topics</div></div>
      <div class="digest-cats">${(data.categories||[]).slice(0,5).map(c=>`<span class="digest-chip">${esc(c.name)} <b>${c.count}</b></span>`).join("")}</div>
      <div class="digest-highs">${digestHighlights.map(h=>`<a data-hid="${h.id}">${esc(h.title)}</a>`).join("")}</div>`;
    $$("[data-hid]", d).forEach(a => a.addEventListener("click", () => {
      const h = digestHighlights.find(x => x.id == a.dataset.hid);
      if (h) openReader({ id:h.id, title:h.title, link:h.link, source:h.source, category:h.category, published:h.published, published_ts:h.published_ts });
    }));
  }).catch(() => d.remove());
}

/* --- Reader (C1 + C3 progress) --- */
function openReader(art) {
  currentReaderArt = art;
  const r = $("#reader"); r.hidden = false; document.body.style.overflow = "hidden";
  $("#reader-src").textContent = art.source + (VERIFIED.has(art.source) ? " \u2713" : "");
  $("#reader-title").textContent = art.title;
  $("#reader-meta").textContent = `${timeAgo(art.published_ts ?? art.published) || ""} \u00b7 ~${readTime(art)} min read`;
  $("#reader-open").href = safeUrl(art.link);
  const body = $("#reader-body");
  body.innerHTML = '<div class="reader-loading"><div class="spinner"></div><div>Loading article&hellip;</div></div>';
  $("#reader-save").textContent = state.saved.has(art.id) ? "Saved \u2713" : "Save";
  $("#reader-save").classList.toggle("active", state.saved.has(art.id));
  $("#reader-scroll").scrollTop = 0; $("#reader-progress").style.width = "0%";
  fetch(`/api/articles/${art.id}/content`).then(x => x.json()).then(d => {
    if (d && d.paragraphs && d.paragraphs.length) {
      body.innerHTML = d.paragraphs.map(p => `<p class="reader-para">${esc(p)}</p>`).join("");
      const words = d.paragraphs.join(" ").split(/\s+/).length;
      $("#reader-meta").textContent = `${timeAgo(art.published_ts ?? art.published) || ""} \u00b7 ~${Math.max(1,Math.round(words/200))} min read \u00b7 ${art.source}`;
    } else {
      body.innerHTML = '<p class="reader-para dim">Full text is unavailable (paywall or bot-blocked). Use &ldquo;Open original&rdquo; to read it.</p>';
    }
  }).catch(() => {
    body.innerHTML = '<p class="reader-para dim">Could not load the full text. Use &ldquo;Open original&rdquo;.</p>';
  });
  trackRead(art.id);
}
function closeReader() { $("#reader").hidden = true; document.body.style.overflow = ""; currentReaderArt = null; }
function readerProgress() {
  const s = $("#reader-scroll"), max = s.scrollHeight - s.clientHeight;
  $("#reader-progress").style.width = (max > 0 ? (s.scrollTop / max * 100) : 0) + "%";
}

/* --- Share (C2) --- */
function shareArt(art) {
  const data = { title: art.title, url: art.link };
  if (navigator.share) { navigator.share(data).catch(() => {}); }
  else copyLink(art);
}
function copyLink(art) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(art.link).then(() => showToast("Link copied")).catch(() => showToast(art.link));
  } else showToast(art.link);
}

/* --- Long-press action sheet (C2) --- */
function openActions(art) {
  const items = [
    { ic: state.saved.has(art.id) ? "\u{1F51E}" : "\u{1F4D1}", label: state.saved.has(art.id) ? "Remove from Saved" : "Save", act: () => toggleSave(art) },
    { ic: "\u{1F517}", label: "Share", act: () => shareArt(art) },
    { ic: "\u{1F517}", label: "Copy link", act: () => copyLink(art) },
    { ic: "\u2197", label: "Open original", act: () => window.open(safeUrl(art.link), "_blank", "noopener") },
    { ic: "\u{1F4C9}", label: "Less like this", act: () => dismissCard(art) },
  ];
  const sheet = $("#actionsheet");
  sheet.innerHTML = '<div class="sheet-handle"></div>' + items.map((it,i) =>
    `<button class="actionsheet-item" data-i="${i}"><span class="ai-ic">${it.ic}</span>${it.label}</button>`).join("");
  $$(".actionsheet-item", sheet).forEach(el => el.addEventListener("click", () => { items[+el.dataset.i].act(); closeActions(); }));
  $("#sheet-backdrop").hidden = false;
}
function closeActions() { $("#sheet-backdrop").hidden = true; }

/* --- Why popover (D1) --- */
function openWhy(art) {
  const p = state.prefs || { sources:{}, categories:{}, total_reads:0 };
  const sp = p.sources[art.source] ?? 0;
  const cp = p.categories[art.category] ?? 0;
  let html = "<h3>Why this story?</h3>";
  if ((p.total_reads || 0) < 3) {
    html += `<p class="dim">You have few reads yet. Keep reading &mdash; the For You feed gets more accurate as you read.</p>`;
  } else {
    html += `<div class="why-row"><span>${esc(art.source)}</span><b>${Math.round(sp*100)}%</b></div>`;
    html += `<div class="why-row"><span>${esc(art.category)}</span><b>${Math.round(cp*100)}%</b></div>`;
    html += `<p class="dim">Scored from what you&rsquo;ve read, weighted toward recent.</p>`;
  }
  html += '<button class="rbtn why-close">Got it</button>';
  $("#why-pop").innerHTML = html;
  $("#why-backdrop").hidden = false;
  $(".why-close", $("#why-pop")).addEventListener("click", closeWhy);
}
function closeWhy() { $("#why-backdrop").hidden = true; }

/* --- Theme --- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("lumenfeed-theme", t);
  $("#theme-toggle").textContent = t === "dark" ? "\u{2600}\uFE0F" : "\u{1F319}";
}
function toggleTheme() { applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }

/* --- Refresh / pull-to-refresh --- */
async function refreshFeeds() {
  const btn = $("#refresh-btn");
  btn.classList.add("spinning");
  try { await fetch("/api/refresh", { method:"POST" }); } catch (e) {}
  resetFeed(); loadPrefs();
  setTimeout(() => btn.classList.remove("spinning"), 600);
}
function initPullToRefresh() {
  let startY = 0, pulling = false;
  document.addEventListener("touchstart", (e) => {
    if (window.scrollY <= 0 && e.target.closest("#feed")) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive:true });
  document.addEventListener("touchmove", (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) $("#pull-indicator").classList.toggle("show", dy > 60);
  }, { passive:true });
  document.addEventListener("touchend", (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 80) refreshFeeds();
    pulling = false; $("#pull-indicator").classList.remove("show");
  }, { passive:true });
}

/* --- Scroll progress + back-to-top --- */
function initScroll() {
  const bar = $("#progress-bar");
  window.addEventListener("scroll", () => {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    const pct = max > 0 ? (h.scrollTop / max * 100) : 0;
    bar.style.width = pct + "%";
    bar.classList.toggle("visible", pct > 2 && pct < 99);
    $("#back-top").classList.toggle("visible", window.scrollY > 600);
  }, { passive:true });
  $("#back-top").addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));
}

/* --- Preferences (drives D2 focus + D1) --- */
async function loadPrefs() {
  try {
    const r = await fetch("/api/preferences");
    state.prefs = await r.json();
    updateRings();
  } catch (e) {}
}

/* --- Init --- */
applyTheme(localStorage.getItem("lumenfeed-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
buildStoryRings();
$$(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
$("#refresh-btn").addEventListener("click", refreshFeeds);
$("#theme-toggle").addEventListener("click", toggleTheme);
$("#reader-close").addEventListener("click", closeReader);
$("#reader-share").addEventListener("click", () => { if (currentReaderArt) shareArt(currentReaderArt); });
$("#reader-save").addEventListener("click", () => { if (currentReaderArt) toggleSave(currentReaderArt); });
$("#reader-scroll").addEventListener("scroll", readerProgress);
$("#sheet-backdrop").addEventListener("click", (e) => { if (e.target.id === "sheet-backdrop") closeActions(); });
$("#why-backdrop").addEventListener("click", (e) => { if (e.target.id === "why-backdrop") closeWhy(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeReader(); closeActions(); closeWhy(); } });
initPullToRefresh();
initScroll();
const observer = new IntersectionObserver((es) => { if (es[0].isIntersecting) fetchFeed(); }, { rootMargin:"400px" });
observer.observe(sentinel);
setTab(state.tab);
loadPrefs();
updateSavedCount();
</script>
</body>
</html>
